apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-app-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distributed-app
      track: canary
  template:
    metadata:
      labels:
        app: distributed-app
        track: canary
    spec:
      containers:
        - name: distributed-app
          image: distributed-app:v3
          imagePullPolicy: Never
          env:
            - name: APP_VERSION
              value: "v3-canary"
            - name: APP_MESSAGE
              value: "Versión CANARY (v3) - En prueba"
          ports:
            - containerPort: 3000
